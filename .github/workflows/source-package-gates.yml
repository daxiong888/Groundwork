name: source-package-gates

on:
  pull_request:
  push:
    branches:
      - main
      - v0.4.x-trace-first-roadmap

jobs:
  source-package-gate:
    name: Source and package gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax
        run: |
          python -m py_compile \
            scripts/check_runtime_package_boundary.py \
            scripts/check_skill_entry_budget.py \
            scripts/run_plugin_candidate_trial.py \
            scripts/codex-hooks/groundwork_route_detection.py \
            scripts/codex-hooks/groundwork_router_event.py \
            scripts/codex-hooks/groundwork_router_telemetry.py

      - name: Package and token budget guardrails
        run: |
          python scripts/check_runtime_package_boundary.py
          python scripts/check_skill_entry_budget.py

      - name: Ordinary source tests
        run: |
          python -m unittest tests.test_child_goal_prompt_linter
          python -m unittest tests.test_pipeline_ownership
          python -m unittest tests.test_plugin_candidate_trial
          python -m unittest tests.test_review_contract
          python -m unittest tests.test_route_registry
          python -m unittest tests.test_router_hooks
          python -m unittest tests.test_runtime_package_manifest
          python -m unittest tests.test_wiki_templates

      - name: Whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check HEAD
          fi
