<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity Filter Prototype</title>
    <meta name="groundwork-fixture" content="static-filter-prototype" />
    <meta name="groundwork-contract-status" content="prototype-only; no backend source truth in fixture" />
    <meta
      name="groundwork-contract-boundary"
      content="confirmed_backend_fields=none; proposed_backend_hypotheses=activity filter ownership; mock_fields=task ids phone numbers activity labels; client_derived_logic=activity filter visibility"
    />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2328;
        background: #f6f8fa;
      }

      main {
        max-width: 760px;
        margin: 32px auto;
        padding: 24px;
        background: #ffffff;
        border: 1px solid #d0d7de;
        border-radius: 8px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 22px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
      }

      label {
        display: grid;
        gap: 4px;
        font-size: 13px;
        font-weight: 600;
      }

      select,
      input {
        min-width: 180px;
        padding: 8px 10px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font: inherit;
      }

      .activity-filter[data-visible="false"] {
        display: none;
      }

      .hint {
        margin: 0 0 16px;
        color: #57606a;
        font-size: 14px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
      }

      th,
      td {
        padding: 10px 8px;
        border-top: 1px solid #d8dee4;
        text-align: left;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>标注任务列表筛选</h1>
      <p class="hint" id="mode-hint">多活动任务：展示活动筛选器。</p>

      <section class="toolbar" aria-label="筛选条件">
        <label>
          手机号
          <input aria-label="手机号" value="13800000002" />
        </label>
        <label class="activity-filter" data-visible="true">
          活动名称
          <select aria-label="活动名称">
            <option>全部活动</option>
            <option>安检活动</option>
            <option>抄表活动</option>
          </select>
        </label>
      </section>

      <table>
        <thead>
          <tr>
            <th>任务</th>
            <th>手机号</th>
            <th>活动</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>task-2</td>
            <td>13800000002</td>
            <td>安检活动</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
