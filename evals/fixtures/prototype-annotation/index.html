<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Prototype annotation boundary fixture</title>
  </head>
  <body>
    <main>
      <h1>Account status</h1>
      <p data-product-content-id="validation_message">Select one active account.</p>
      <button type="button">Continue</button>
    </main>

    <aside data-annotation-id="review_arrows" data-annotation-purpose="internal flow explanation">
      Arrow: selection enables Continue.
    </aside>
    <aside data-annotation-id="debug_badges" data-annotation-purpose="internal state debugging">
      debug state=eligible
    </aside>
    <aside data-annotation-id="design_notes" data-annotation-purpose="designer review rationale">
      Compare spacing with the compact variant.
    </aside>
    <aside data-annotation-id="help_explanation" data-annotation-purpose="candidate audience help copy">
      Choose the account you want to continue with.
    </aside>
  </body>
</html>
